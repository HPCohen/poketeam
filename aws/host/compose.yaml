name: poketeam
x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is required}
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
    LISTEN_ADDR: 0.0.0.0:3000
    RUST_LOG: poketeam=info,tower_http=info
  mem_limit: 256m
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: poketeam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: poketeam
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=40"]
    volumes:
      - /srv/poketeam/postgres:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poketeam -d poketeam"]
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ["migrate"]
    profiles: ["tools"]
  api:
    <<: *app
    command: ["serve"]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
  web:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/poketeam/public:/usr/share/nginx/html:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
